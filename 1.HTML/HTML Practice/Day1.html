<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <title>Document</title>
</head>
<body class="flex flex-col min-h-screen w-screen justify-center items-center bg-pink-100">
    <div class="Profile-Card">
        <div class="flex flex-col h-140 w-90">
            <div class="flex justify-center items-center h-60 bg-white rounded-t-4xl">
                <img class="size-50 rounded-full border-pink-200 border-8 p-1"
                     src="Tailwind-man profile card.webp"
                     alt="man-image">
            </div>

            <div class="flex flex-col justify-center items-center bg-pink-400 h-80 text-center text-black rounded-b-4xl">
                <p class="relative bottom-15 font-medium text-2xl">
                    Tejas J. Pawar
                </p>

                <p class="relative bottom-6 font-semibold">
                    Pune, Maharashtra
                </p>

                <p class="relative bottom-6 font-semibold">
                    UI/UX Designer and Frontend Developer
                </p>

                <div class="flex flex-row space-x-10 relative top-6">
                    <button class="border-2 p-2 w-30 text-center rounded-3xl bg-pink-600 hover:bg-pink-300">
                        Follow
                    </button>

                    <button class="border-2 p-2 w-30 text-center rounded-3xl bg-pink-600 hover:bg-pink-300">
                        Message
                    </button>
                </div>
            </div>
        </div>
    </div>

</html>
