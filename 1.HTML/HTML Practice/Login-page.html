<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <title>Login Page</title>
</head>
<body class="flex min-h-screen justify-center items-center bg-linear-to-t from-sky-500 to-indigo-500">
    <main>
        <section>
            <article class="flex flex-row justify-center items-center p-10 w-270 gap-x-25 rounded-3xl bg-[#dad8fb]">

                <div class=" flex flex-col text-center gap-5 ">

                    <h1 class="text-3xl font-bold">WELCOME</h1>
                    <button  class="border-2 p-1.5 rounded-2xl flex flex-row w-80 
                                    items-center justify-center relative
                                    hover:transition delay-150 duration-300 ease-in-out hover:translate-y-0.5 hover:scale-90 hover:bg-white">
                    

                    <img    class="size-9 rounded-2xl absolute left-0" 
                                   src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6U4pRN-hmnCKRp5bBpsxjHfbbutWDEgFRUo0YrTP2ag&s=10" 
                                   alt="Google Image">Login In With Google</button>

                    <input type="email" 
                           placeholder="Your Email" 
                           class="pl-4 rounded-2xl p-3 border-2 mt-6" 
                           class="border-2">


                    <input type="password" 
                           placeholder="Your Password" 
                           class="border-2 rounded-2xl p-3">

                           
                    <div class="flex flex-row">

                        <input type="checkbox">Keep Me logged in
                        <a class="underline ml-14" 
                           href="#">Forgot Password </a>

                    </div>

                    <button class="border-2 rounded-2xl font-bold 
                            hover:transition delay-150 duration-300 ease-in-out 
                            hover:translate-y-0.5 hover:scale-90 hover:bg-white p-3">Log in</button>
                            
                    <p>Don't have an account yet? <a href="#" 
                            class="underline">Sign up</a></p>
                            
                </div>
                <div>
                    <img class=" rounded-3xl h-100 w-120" 
                    src="https://static.vecteezy.com/system/resources/thumbnails/003/689/228/small_2x/online-registration-or-sign-up-login-for-account-on-smartphone-app-user-interface-with-secure-password-mobile-application-for-ui-web-banner-access-cartoon-people-illustration-vector.jpg" 
                    alt="Login page image">
                </div>
            </article>
        </section>
    </main>
</body>
</html>
